[project]
name = "kibernikto"
version = "2.0.0b1"
description = "Kibernikto - best AI friend with Telegram bot integration"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
authors = [
    { name = "Kibernikto Team", email = "solovieff.nnov@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic-ai>=2.55.0,<3",
    "logfire>=5.1.1,<6",
    "aiogram>=3.31.0,<4",
    "aiohttp>=3.14.5,<4",
    "aiofiles>=25.1.0,<26",
    "certifi>=2026.7.22",
    "python-dotenv>=1.2.4",
    "pydantic-ai-harness[researcher,exa]>=0.55.0,<0.56",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    "asyncpg>=0.32.0,<0.33",
    "aiosqlite>=0.22.1,<0.23",
    "aioboto3>=15.5.0,<16",
    "pydantic-ai-slim[spec]>=2.55.0,<3",
]

[project.urls]
Homepage = "https://github.com/solovieff/kibernikto"
Repository = "https://github.com/solovieff/kibernikto"

[project.scripts]
kibernikto = "kibernikto.cmd.__start:start"

[tool.setuptools.packages.find]
include = ["kibernikto*"]
namespaces = false

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["build", "env", "venv", ".venv", ".kbnkt_filestore", "ai_tmp"]

[tool.ruff.lint]
# Correctness-only: undefined names, syntax, pyflakes. Style rules stay off until the codebase is normalised.
select = ["E9", "F"]
# Package __init__ modules are public re-export surfaces (AGENTS.md forbids __all__ there).
per-file-ignores = { "**/__init__.py" = ["F401"] }

[tool.logfire]
ignore_no_config = true

