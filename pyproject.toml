[project]
name = "kibernikto"
version = "2.0.1"
description = "Kibernikto - best AI friend with Telegram bot integration"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
authors = [
    { name = "Kibernikto Team", email = "solovieff.nnov@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic-ai>=2.27.0,<3",
    "logfire>=4.40.0,<5",
    "aiogram>=3.30.0,<4",
    "aiofiles>=25.1.0,<26",
    "certifi>=2026.7.22",
    "python-dotenv>=1.2.2",
    "pydantic-ai-harness>=0.18.0,<0.19",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "asyncpg>=0.31.0,<0.32",
    "aiosqlite>=0.22.1,<0.23",
    "aioboto3>=15.5.0,<16",
]

[project.urls]
Homepage = "https://github.com/solovieff/kibernikto"
Repository = "https://github.com/solovieff/kibernikto"

[project.scripts]
kibernikto = "kibernikto.cmd.__start:start"

[tool.setuptools.packages.find]
include = ["kibernikto*"]
namespaces = false

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.logfire]
ignore_no_config = true

