[project]
name = "kibernikto"
version = "2.0.1"
description = "Kibernikto - best AI friend with Telegram bot integration"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
authors = [
    { name = "Kibernikto Team", email = "solovieff.nnov@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic-ai==2.13.0",
    "logfire==4.38.0",
    "aiogram>=3.30.0",
    "aiofiles>=24.1.0",
    "certifi>=2026.1.4",
    "python-dotenv>=1.2.2",
    "pydantic-ai-harness[dynamic-workflow]>=0.7.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "aioboto3>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/solovieff/kibernikto"
Repository = "https://github.com/solovieff/kibernikto"

[project.scripts]
kibernikto = "kibernikto.cmd.__start:start"

[tool.setuptools]
packages = ["kibernikto"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.logfire]
ignore_no_config = true

